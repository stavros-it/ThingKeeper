name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller thingkeeper.spec --noconfirm --clean

      - name: Create portable zip
        shell: pwsh
        run: |
          $tag = ${env:GITHUB_REF}.Split('/')[-1]
          Compress-Archive -Path dist/ThingKeeper -DestinationPath "ThingKeeper-${tag}-windows-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThingKeeper-windows-portable
          path: ThingKeeper-*-windows-portable.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libfuse2 \
            file

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller thingkeeper.spec --noconfirm --clean

      - name: Build AppImage
        run: |
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy PyInstaller output (onedir: binary + _internal/ folder)
          cp -r dist/ThingKeeper/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/ThingKeeper

          # Copy icon
          cp thingkeeper/assets/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/thingkeeper.png
          cp thingkeeper/assets/icon-256.png AppDir/thingkeeper.png

          # Copy .desktop file
          cp packaging/thingkeeper.desktop AppDir/thingkeeper.desktop

          # Copy AppRun script
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Build AppImage (extract-and-run because FUSE may not work in CI)
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool-x86_64.AppImage AppDir ThingKeeper-x86_64.AppImage

      - name: Rename with tag
        run: |
          tag=${GITHUB_REF#refs/tags/}
          mv ThingKeeper-x86_64.AppImage "ThingKeeper-${tag}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThingKeeper-linux-appimage
          path: ThingKeeper-*.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ThingKeeper-*-windows-portable.zip
            ThingKeeper-*.AppImage
